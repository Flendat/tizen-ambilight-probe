<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ambilight Probe</title>
</head>
<body style="background:#101820;color:white;font:28px Arial;padding:50px">
  <h1>Ambilight Hardware Probe</h1>
  <pre id="result">Connecting to service...</pre>
  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'http://127.0.0.1:18766/', true);

    xhr.onload = function() {
      document.getElementById('result').textContent =
        xhr.responseText;
    };

    xhr.onerror = function() {
      document.getElementById('result').textContent =
        'Service unavailable';
    };

    xhr.send();
  </script>
</body>
</html>
